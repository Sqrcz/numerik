name: Mutation Testing

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  infection:
    runs-on: ubuntu-latest
    name: Infection
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: pcov
          coverage: pcov
          tools: composer:v2

      - name: Cache vendor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: vendor-mutation-${{ hashFiles('composer.json') }}

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Run Infection (changed files only)
        if: github.event_name == 'pull_request'
        run: infection --threads=max --git-diff-filter=AM --git-diff-base=origin/${{ github.base_ref }}
        continue-on-error: true

      - name: Run Infection (full)
        if: github.event_name != 'pull_request'
        run: infection --threads=max
        continue-on-error: true
